# Runs the Accordant conformance model against a real Resonate server.
#
# Three checkouts have to line up before anything runs:
#
#   $GITHUB_WORKSPACE/
#   ├── resonate-accordant/   this repo (the model + the raw-HTTP harness)
#   ├── accordant/            microsoft/accordant — ResonateConformance.csproj
#   │                         references ../accordant/... by PATH, not by package
#   └── resonate/             the server under test (default branch: core-crate)
#
# The server is started as `dev --debug`, not `serve`. Under the debug flag the
# clock belongs to the caller: `debug.reset` / `debug.tick` are answered and
# `head["resonate:debug_time"]` is honoured, which is what the harness's driven
# clock and its per-case reset need. Without it those ops are 403 and the
# injected time is ignored.
#
# BASELINE against resonatehq/resonate@core-crate, measured 2026-08-28. These
# legs are RED today, and deliberately left blocking — they are the findings,
# not noise. A run showing anything beyond this list is a new divergence:
#
#   gen                 11/513 cases fail — 2 on P-04, 9 on P-05
#   fuzz                1 failure at op #37, also P-04
#   trace               130 ok / 7 failed — 3 are the missing `debug.messages`
#                       egress tap, 4 are rule divergences (P-02, P-04, T-06 x2)
#   indefinite-selftest 3 of 9 fail — model-side only, no server involved
#
#   AWAITABILITY. One server gap, seen from three doors. The spec calls a
#   promise external if it carries resonate:external, resonate:target, or
#   resonate:timer, and refuses an await on anything else. The server checks
#   only that the AWAITER is targeted; on the AWAITED side it has no such
#   notion, so it admits every await:
#     P-04  register_callback on an internal awaited (external.lean:74) — 422 vs 200
#     P-05  register_listener on an internal awaited (external.lean:91) — 422 vs 200
#     T-06  task.suspend awaiting an internal promise — 422 vs 200
#   T-06 also covers suspend with duplicate awaited ids: model 400, server 200.
#
#   P-02  promise.create carrying BOTH resonate:timer and resonate:target:
#         model wants 400, server answers 200. The combination is malformed —
#         a target says a worker executes this promise, a timer says nothing
#         does — and validation.lean:43 refuses it at every birth door.
#
# Passing today: concurrent, lease, poll (skips itself, no caps), races,
# reorder, linz, invariant-selftest.
#
# A passing leg is not agreement: on address validity and on origins this
# model states the SERVER's answer, which the specification contradicts.
# docs/spec-divergences.md has all three positions, rule by rule.

name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, with a fresh fuzz seed.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      resonate_ref:
        description: "resonatehq/resonate ref to test"
        type: string
        default: core-crate
      fuzz_ops:
        description: "Operations per fuzz run"
        type: number
        default: 2000
  # So resonatehq/resonate can gate its own PRs on this suite:
  #   uses: resonatehq/resonate-accordant/.github/workflows/conformance.yml@main
  #   with: { resonate_ref: ${{ github.sha }} }
  workflow_call:
    inputs:
      resonate_ref:
        type: string
        default: core-crate
      fuzz_ops:
        type: number
        default: 2000

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The commit of microsoft/accordant to build against. Pinned rather than
  # floating on main: the csproj needs the happens-before AllowsConcurrent
  # overload (upstream #31) that HistoryTests uses, which is past the 0.1.6
  # NuGet release. Bump deliberately.
  ACCORDANT_REF: main
  RESONATE_REF: ${{ inputs.resonate_ref || 'core-crate' }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build the server once; every mode below runs against the same binary.
  # ───────────────────────────────────────────────────────────────────────────
  server:
    name: Build server (${{ inputs.resonate_ref || 'core-crate' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout resonate
        uses: actions/checkout@v5
        with:
          repository: resonatehq/resonate
          ref: ${{ env.RESONATE_REF }}
          path: resonate

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          workspaces: resonate

      # Debug profile on purpose: ~3 min to compile versus ~2x that for release,
      # and the harness is latency-insensitive (it drives one request at a time,
      # or a small concurrent burst). Switch to --release if a fuzz leg starts
      # timing out on server CPU rather than on compile.
      - name: Build
        working-directory: resonate
        run: cargo build --bin resonate

      - name: Record the commit under test
        run: |
          cd resonate
          SHA=$(git rev-parse HEAD)
          echo "### Server under test" >> "$GITHUB_STEP_SUMMARY"
          echo "\`resonatehq/resonate@${SHA}\` (${RESONATE_REF})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: resonate-server
          path: resonate/target/debug/resonate
          retention-days: 3

  # ───────────────────────────────────────────────────────────────────────────
  # One leg per mode. Each gets its own server process, so a mode that wedges
  # the server cannot cascade into the others.
  # ───────────────────────────────────────────────────────────────────────────
  conform:
    name: ${{ matrix.name }}
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: generated sequential
            args: gen
          - name: concurrent
            args: concurrent
          - name: lease / timeout
            args: lease
          - name: race repros
            args: races 300
          - name: reorder
            args: reorder 100
          - name: linearizability
            args: linz 10
          - name: fuzz
            args: fuzz ${{ github.run_id }} ${{ inputs.fuzz_ops || 2000 }}
          - name: invariant self-test
            args: invariant-selftest
          - name: indefinite self-test
            args: indefinite-selftest
          # Three of trace's seven failures are the missing `debug.messages`
          # egress tap — an op the server does not implement (400 Unknown
          # operation), which no server change short of adding the tap can fix.
          # The other four are real divergences, listed at the top of this file.
          - name: example traces
            args: trace

    steps:
      - name: Checkout resonate-accordant
        uses: actions/checkout@v5
        with:
          path: resonate-accordant

      # Must be a SIBLING of resonate-accordant: the csproj reaches it as
      # ../accordant/Accordant.Operations/Accordant.Operations.csproj.
      - name: Checkout microsoft/accordant
        uses: actions/checkout@v5
        with:
          repository: microsoft/accordant
          ref: ${{ env.ACCORDANT_REF }}
          path: accordant

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: resonate-server
          path: bin

      - name: Start the server
        run: |
          chmod +x bin/resonate
          # --debug: the caller owns the clock (debug.* answered, debug_time
          # honoured, no wall-clock timeout sweep).
          # dev: in-memory SQLite, so debug.reset between cases is cheap and
          # nothing survives the job.
          # --level warn: an info-level line per request buries a fuzz log.
          nohup bin/resonate dev --debug --level warn > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8001/health >/dev/null && exit 0
            sleep 1
          done
          echo "server did not become healthy"; cat server.log; exit 1

      - name: Run conformance model — ${{ matrix.args }}
        env:
          RESONATE_URL: http://localhost:8001
          # Optional capabilities the model probes for. Left EMPTY: core-crate
          # implements neither `task.poll` (poll) nor `debug.messages` (egress),
          # so declaring them would fail legs the server never promised to pass.
          RESONATE_CAPS: ""
        run: |
          dotnet run --project resonate-accordant/ResonateConformance.csproj \
            -c Release -- ${{ matrix.args }}

      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ strategy.job-index }}
          path: server.log
          retention-days: 7
